from textwrap import dedent

light = dedent('''<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220">
<defs>
<linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#00c6ff"/>
<stop offset="100%" stop-color="#0072ff"/>
</linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="220" fill="transparent"/>
<path d="M60 110 C180 20 300 200 420 110 S660 20 780 110 S1020 200 1140 110"
fill="none" stroke="url(#g)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
<circle cx="1140" cy="110" r="18" fill="#00c6ff" filter="url(#glow)"/>
<circle cx="1146" cy="104" r="2" fill="white"/><circle cx="1146" cy="116" r="2" fill="white"/>
<text x="40" y="35" font-size="24" fill="#0072ff" font-family="Segoe UI">⚡ Glowing Snake • Light</text>
<animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
</svg>''')

dark = dedent('''<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220">
<defs>
<linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#ff512f"/>
<stop offset="100%" stop-color="#dd2476"/>
</linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="220" fill="#0d1117"/>
<path d="M60 110 C180 20 300 200 420 110 S660 20 780 110 S1020 200 1140 110"
fill="none" stroke="url(#g)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
<circle cx="1140" cy="110" r="18" fill="#ff512f" filter="url(#glow)"/>
<circle cx="1146" cy="104" r="2" fill="white"/><circle cx="1146" cy="116" r="2" fill="white"/>
<text x="40" y="35" font-size="24" fill="#ff6b6b" font-family="Segoe UI">⚡ Glowing Snake • Dark</text>
<animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
</svg>''')

open('/mnt/data/glowing-snake-light.svg','w').write(light)
open('/mnt/data/glowing-snake-dark.svg','w').write(dark)
print("done")
