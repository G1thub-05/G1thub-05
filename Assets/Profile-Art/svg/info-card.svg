<g class="ln" style="animation-delay:1.04s"><text x="24" y="204" font-size="13"><tspan fill="#ff7b9c" font-weight="700">Frontend</tspan><tspan x="116" fill="#c9d1d9">React · JavaScript · TypeScript</tspan></text></g>
<g class="ln" style="animation-delay:1.13s"><text x="24" y="224" font-size="13"><tspan fill="#39d353" font-weight="700">Backend</tspan><tspan x="116" fill="#c9d1d9">Java · Spring Boot · Node.js</tspan></text></g>
<g class="ln" style="animation-delay:1.22s"><text x="24" y="244" font-size="13"><tspan fill="#58d5e8" font-weight="700">Database</tspan><tspan x="116" fill="#c9d1d9">SQL · NoSQL</tspan></text></g>
