<g class="ln" style="animation-delay:1.58s"><text x="24" y="324" font-size="13"><tspan fill="#39d353" font-weight="700">Repos</tspan><tspan x="116" fill="#c9d1d9">8 public  ·  20 stars</tspan></text></g>
<g class="ln" style="animation-delay:1.67s"><text x="24" y="344" font-size="13"><tspan fill="#58d5e8" font-weight="700">Activity</tspan><tspan x="116" fill="#c9d1d9">911 contributions this year</tspan></text></g>
<g class="ln" style="animation-delay:1.76s"><text x="24" y="364" font-size="13"><tspan fill="#bc8cff" font-weight="700">Streak</tspan><tspan x="116" fill="#c9d1d9">19d current  ·  19d best</tspan></text></g>
