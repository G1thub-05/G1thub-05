<svg
    xmlns="http://www.w3.org/2000/svg"
    width="860"
    height="210"
    viewBox="0 0 860 210"
    font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">

<defs>
    <style>
:root {
    color-scheme: dark;

    --window-bg: #0d1117;
    --window-fg: #c9d1d9;
    --window-panel: #161b22;
    --window-border: #30363d;
    --window-muted: #8b949e;

    --color-green: #39d353;
    --color-cyan: #58d5e8;
    --color-purple: #bc8cff;
    --color-orange: #ffa657;
    --color-pink: #ff7b9c;
    --color-sweep: #fff;
    --color-cmd: #39d353;

    --globe-land-dot: #39d353;
    --globe-atmosphere: #58d5e8;
    --globe-home-pin: #ffa657;
    --globe-packet-pink: #ff7b9c;


    --ocean-center: #16324a;
    --ocean-mid: #0c1724;
    --ocean-edge: #070b12;
    --shade-color: #05080d;
    --shade-opacity: 0.75;
    --globe-grid: #2d3a4a;

    --tech-languages: #F2C14E;
    --tech-frontend: #58D5E8;
    --tech-backend: #39D353;
    --tech-databases: #FFA657;
    --tech-messaging: #BC8CFF;
    --tech-cloud-devops: #79C0FF;
    --tech-monitoring: #FF7B72;
    --tech-testing-quality: #FF7B9C;
    --tech-wireframe: #2D3A4A;
    --tech-core: #BC8CFF;
    --tech-glow: #58D5E8;
    --tech-wireframe-width: 0.9;
    --tech-wireframe-opacity: 0.9;

    --top-0: #161b22; /* Level 0: No contributions */
    --top-1: #0e4429; /* Level 1: Very low */
    --top-2: #006d32; /* Level 2: Low */
    --top-3: #26a641; /* Level 3: Medium */
    --top-4: #39d353; /* Level 4: High */
    --top-5: #69f0a0; /* Level 5: Highest */

    --left-0: #171d25; /* Level 0: No contributions */
    --left-1: #0a3820; /* Level 1: Very low */
    --left-2: #005528; /* Level 2: Low */
    --left-3: #1d8136; /* Level 3: Medium */
    --left-4: #2d9f46; /* Level 4: High */
    --left-5: #4bbd70; /* Level 5: Highest */

    --right-0: #12171e; /* Level 0: No contributions */
    --right-1: #082d1b; /* Level 1: Very low */
    --right-2: #06451f; /* Level 2: Low */
    --right-3: #155c29; /* Level 3: Medium */
    --right-4: #227538; /* Level 4: High */
    --right-5: #3d995b; /* Level 5: Highest */
}


/* Glass effect styles — yahan add karo */
.glass-panel {
    fill: var(--window-panel);
    stroke: var(--window-border);
    stroke-width: 1;
}

.glass-highlight {
    fill: none;
    stroke: rgba(255, 255, 255, 0.8);
    stroke-width: 1;
}


@media (prefers-color-scheme: light) {
    :root {
        color-scheme: light;

        /* Main window */
        --window-bg: #E8ECF0;
        --window-fg: #161B22;
        --window-panel: rgba(255, 255, 255, 0.68);
        --window-border: rgba(255, 255, 255, 0.85);
        --window-muted: #57606A;

        /* Accent colors */
        --color-green: #03d329;
        --color-cyan: #58d5e8;
        --color-purple: #8250DF;
        --color-orange: #f07a05;
        --color-sweep: #03d329;
        --color-cmd:#CF222E;


        --globe-land-dot: #2F8F46;
        --globe-atmosphere: #36AFC0;
        --globe-home-pin: #B54708;
        --globe-packet-pink: #C04483;
        --ocean-center: #E3EDF6;
        --ocean-mid: #C7D9E9;
        --ocean-edge: #9CB5CC;
        --shade-color: #526779;
        --shade-opacity: 0.22;
        --globe-grid: #7193B1;

        --tech-languages: #8A6500;
        --tech-frontend: #218B9A;
        --tech-backend: #2F8F46;
        --tech-databases: #BC4C00;
        --tech-messaging: #8250DF;
        --tech-cloud-devops: #0969DA;
        --tech-monitoring: #CF222E;
        --tech-testing-quality: #BF3989;
        --tech-wireframe: #7193B1;
        --tech-core: #40C463;
        --tech-glow: #218B9A;
        --tech-wireframe-width: 0.7;
        --tech-wireframe-opacity: 0.48;

        /* Contribution tops */
        --top-0: #E0E0E0;        /* Level 0: No contributions */
        --top-1: #9BE9A8;        /* Level 1: Very low */
        --top-2: #40C463;        /* Level 2: Low */
        --top-3: #30A14E;        /* Level 3: Medium */
        --top-4: #216E39;        /* Level 4: High */
        --top-5: #14532D;        /* Level 5: Highest */

        /* Left building faces */
        --left-0: #171D25;        /* Level 0: No contributions */
        --left-1: #78C985;        /* Level 1: Very low */
        --left-2: #329C4D;        /* Level 2: Low */
        --left-3: #268440;        /* Level 3: Medium */
        --left-4: #195A30;        /* Level 4: High */
        --left-5: #104523;        /* Level 5: Highest */

        /* Right building faces */
        --right-0: #12171E;       /* Level 0: No contributions */
        --right-1: #60AE70;       /* Level 1: Very low */
        --right-2: #278440;       /* Level 2: Low */
        --right-3: #1C6C35;       /* Level 3: Medium */
        --right-4: #164A29;       /* Level 4: High */
        --right-5: #0C381C;       /* Level 5: Highest */
    }
}

</style>
    
<linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
  <stop offset="0" stop-color="var(--color-green)"/><stop offset="0.5" stop-color="var(--color-cyan)"/><stop offset="1" stop-color="var(--color-purple)"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="nameGradStatic" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="var(--color-green)"/><stop offset="0.5" stop-color="var(--color-cyan)"/><stop offset="1" stop-color="var(--color-purple)"/>
</linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.05"/></pattern>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--color-green)" stop-opacity="0"/><stop offset="1" stop-color="var(--color-green)" stop-opacity="0.08"/></linearGradient>
<clipPath id="inner"><rect x="1" y="33" width="858" height="176" rx="9"/></clipPath>
<clipPath id="cmdClip"><rect x="207.6" y="40" width="0" height="20"><animate attributeName="width" from="0" to="86.0" begin="0.3s" dur="0.6s" fill="freeze"/></rect></clipPath>
<style>
  .fade { opacity: 0; animation: in .7s ease-out forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</defs>

<rect
    x="0.5"
    y="0.5"
    width="859"
    height="209"
    rx="10"
    fill="var(--window-bg)"
    stroke="var(--window-border)"
/>

<path
    d="M0.5 27 V10.5
       a10 10 0 0 1 10 -10
       H849.5
       a10 10 0 0 1 10 10
       V28 Z"
    fill="var(--window-panel)"
/>

<line
    x1="0.5"
    y1="27"
    x2="859.5"
    y2="27"
    stroke="var(--window-border)"
/>

<circle cx="18" cy="14" r="3.5" fill="#ff5f56"/>
<circle cx="36" cy="14" r="3.5" fill="#ffbd2e"/>
<circle cx="54" cy="14" r="3.5" fill="#27c93f"/>

<text
    x="430.0"
    y="18"
    fill="var(--window-muted)"
    font-size="13"
    text-anchor="middle">~/Digeshwar — .sh</text>


<g clip-path="url(#inner)">
  <rect x="0" y="32" width="860" height="210" fill="url(#dots)"/>
  <rect x="0" y="-40" width="860" height="40" fill="url(#scan)"><animate attributeName="y" values="-10;210" dur="5s" repeatCount="indefinite"/></rect>
</g>
<text x="40" y="55" font-size="14"><tspan fill="var(--color-cmd)">Digeshwar@github:~$</tspan></text>
<text x="207.6" y="55" font-size="14" fill="var(--window-fg)" textLength="84.0" clip-path="url(#cmdClip)">./hello.sh</text>
<g class="fade" style="animation-delay:1s">
  <text x="40" y="112" font-size="46" font-weight="800" letter-spacing="2" fill="url(#nameGrad)" filter="url(#glow)">DIGESHWAR</text>
</g>
<g class="fade" style="animation-delay:1.4s">
  <text x="40" y="148" font-size="16" fill="var(--window-muted)">&gt;</text>
</g>
<g class="fade" style="animation-delay:1.6s"><clipPath id="r0"><rect x="60" y="132" width="0" height="22">
<animate attributeName="width" values="0.0;393.6;393.6;0.0;0.0" keyTimes="0.0000;0.1127;0.1950;0.2325;1.0000" dur="20.0s" repeatCount="indefinite"/></rect></clipPath>
<text x="60" y="148" font-size="16" fill="var(--window-fg)" textLength="393.6" lengthAdjust="spacingAndGlyphs" clip-path="url(#r0)">Full-Stack Developer | Java &amp; Spring Boot</text>
<rect x="60" y="134" width="9" height="18" fill="var(--color-green)" opacity="0">
<animate attributeName="x" values="60.0;453.6;453.6;60.0;60.0" keyTimes="0.0000;0.1127;0.1950;0.2325;1.0000" dur="20.0s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0000;0.2325;0.2326;1" dur="20.0s" repeatCount="indefinite" calcMode="discrete"/>
</rect>
<clipPath id="r1"><rect x="60" y="132" width="0" height="22">
<animate attributeName="width" values="0.0;0.0;441.6;441.6;0.0;0.0" keyTimes="0.0000;0.2500;0.3765;0.4450;0.4825;1.0000" dur="20.0s" repeatCount="indefinite"/></rect></clipPath>
<text x="60" y="148" font-size="16" fill="var(--window-fg)" textLength="441.6" lengthAdjust="spacingAndGlyphs" clip-path="url(#r1)">Building Scalable Web Applications &amp; REST APIs</text>
<rect x="60" y="134" width="9" height="18" fill="var(--color-green)" opacity="0">
<animate attributeName="x" values="60.0;60.0;501.6;501.6;60.0;60.0" keyTimes="0.0000;0.2500;0.3765;0.4450;0.4825;1.0000" dur="20.0s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.2500;0.4825;0.4826;1" dur="20.0s" repeatCount="indefinite" calcMode="discrete"/>
</rect>
<clipPath id="r2"><rect x="60" y="132" width="0" height="22">
<animate attributeName="width" values="0.0;0.0;393.6;393.6;0.0;0.0" keyTimes="0.0000;0.5000;0.6127;0.6950;0.7325;1.0000" dur="20.0s" repeatCount="indefinite"/></rect></clipPath>
<text x="60" y="148" font-size="16" fill="var(--window-fg)" textLength="393.6" lengthAdjust="spacingAndGlyphs" clip-path="url(#r2)">Frontend + Backend + Database Development</text>
<rect x="60" y="134" width="9" height="18" fill="var(--color-green)" opacity="0">
<animate attributeName="x" values="60.0;60.0;453.6;453.6;60.0;60.0" keyTimes="0.0000;0.5000;0.6127;0.6950;0.7325;1.0000" dur="20.0s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.5000;0.7325;0.7326;1" dur="20.0s" repeatCount="indefinite" calcMode="discrete"/>
</rect>
<clipPath id="r3"><rect x="60" y="132" width="0" height="22">
<animate attributeName="width" values="0.0;0.0;499.2;499.2;0.0;0.0" keyTimes="0.0000;0.7500;0.8930;0.9450;0.9825;1.0000" dur="20.0s" repeatCount="indefinite"/></rect></clipPath>
<text x="60" y="148" font-size="16" fill="var(--window-fg)" textLength="499.2" lengthAdjust="spacingAndGlyphs" clip-path="url(#r3)">Exploring Cloud, Microservices &amp; Distributed Systems</text>
<rect x="60" y="134" width="9" height="18" fill="var(--color-green)" opacity="0">
<animate attributeName="x" values="60.0;60.0;559.2;559.2;60.0;60.0" keyTimes="0.0000;0.7500;0.8930;0.9450;0.9825;1.0000" dur="20.0s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.7500;0.9825;0.9826;1" dur="20.0s" repeatCount="indefinite" calcMode="discrete"/>
</rect></g>
<g class="fade" style="animation-delay:1.9s">
  <text x="40" y="182" font-size="13" fill="var(--window-muted)">Raipur, IN  ·  Building Full-stack applications with Java, Spring Boot &amp; Modern Frontend</text>
</g>


</svg>
