# Every day it rebuilds README.md and the images from .readme-patch/config.json and commits only if something changed.
# It uses NO third-party actions: every step is plain shell, and the generator it runs is the copy in .readme-patch/.
# The only permission it asks for is to write to this repository's contents.
# To stop it: delete this file, or switch the workflow off in the Actions tab.

# Name of the workflow displayed in the GitHub Actions tab
name: GitHub-README-Neo

# Define when the workflow should run
on:
  schedule:
    # Run every 12 hours at 00:30 and 12:30 UTC equivalent to 06:00 AM and 06:00 PM IST
    - cron: "30 0,12 * * *"

  # Allow the workflow to be triggered manually
  workflow_dispatch:

# Grant permission to commit and push generated files to repository
permissions:
  contents: write

# Ensure this workflow does not have multiple runs executing at the same time.
# If a new run starts while another is running, the current run will not be cancelled.
concurrency:
  group: generated-profile-assets # Identifier used to group runs of this workflow
  queue: max
  cancel-in-progress: false # Do not cancel a running workflow when another run starts

jobs:
  # JOB 1: Generate and update GitHub statistics and contribution streak cards
  GitHub-README-Neo-Update:
    runs-on: ubuntu-latest # Run on every scheduled or manual jon on an Ubuntu virtual machine runner
    timeout-minutes: 10 # Stop the job if it runs longer than 10 minutes
    steps:
      # Step 1: Clone the current GitHub repository using the GitHub Actions token
      - name: Get this repository

        env:
          GITHUB_TOKEN: ${{ github.token }} # Make the GitHub Actions token available to the shell
        run: |

          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" .
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic $auth"

      # Step 2: Rebuild README.md and the generated images
      # - name: Rebuild the README and images
      #   env:
      #     GITHUB_TOKEN: ${{ github.token }}
      #   run: |

      #     set -euo pipefail
      #     node Assets/.readme-patch/cli.js "$GITHUB_REPOSITORY_OWNER" --config Assets/.readme-patch/config.json --require-activity --clean --out Assets

      # Step 2: Rebuild generated SVG cards only
      - name: Rebuild SVG cards only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          node Assets/.readme-patch/cli.js "$GITHUB_REPOSITORY_OWNER" \
            --config Assets/.readme-patch/config.json \
            --require-activity \
            --clean \
            --out /tmp/readme-generated

          mkdir -p Assets/cards
          find /tmp/readme-generated/cards \
            -maxdepth 1 -type f -name '*.svg' \
            -exec cp -t Assets/cards/ {} +

      # - name: Commit if anything changed
      #   run: |

      #     set -euo pipefail
      #     git config user.name "github-actions[bot]"
      #     git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      #     git add -A

      #     if git diff --cached --quiet; then
      #       echo "Nothing changed today."
      #     else
      #       git commit -m "Update profile stats"
      #       git push
      #     fi

      - name: Commit SVG cards if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- 'Assets/cards/*.svg'

          if git diff --cached --quiet; then
            echo "No SVG card changes."
          else
            git commit -m "Update profile stats cards"
            git push
          fi
