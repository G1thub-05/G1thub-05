name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: G1thub-05
          # outputs: |
          #   dist/github-snake.svg
          #   dist/github-snake-dark.svg?palette=github-dark
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%2300c6ff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23ff512f



      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
