# =============================================================================
# WORKFLOW: GitHub Profile - All-in-One
# =============================================================================
#
# ORGANIZATION:

#   SECTION 1: WHEN THIS WORKFLOW RUNS
#   SECTION 2: PERMISSIONS AND CONCURRENCY
#   SECTION 3: CHECKOUT AND COMMON SETUP
#   SECTION 4: GITHUB README STATISTICS AND PROFILE CARDS (GitHub-README.yml)
#   SECTION 5: NEO CARDS GENERATOR (GitHub-README-Neo.yml)
#   SECTION 6: 3D CONTRIBUTION UNIVERSE GENERATOR (GitHub-README-3D-Universe.yml)
#   SECTION 7: PROFILE ART - PYTHON DATA AND SVG GENERATION (Github-Profile-Art.yml)
#   SECTION 8: Publish the contents of dist/ to the output branch.
#   SECTION 9: PUBLISH dist/ TO THE OUTPUT BRANCH (snake/activity/trophy output job)
#   SECTION 10: COMMIT ALL GENERATED FILES TO MAIN-BRANCH FILES ONCE IF ANYTHING CHNAGED

# SCHEDULE:
#   Runs at 00:30 and 12:30 UTC, which is 06:00 AM and 06:00 PM IST.
#   It can also be started manually from GitHub Actions.
#
# IMPORTANT:
#   - All sections run sequentially in ONE job, on the same checked-out repo.
#   - Generated files on main are committed together at the end, avoiding
#     several workflows racing to push commits to main at the same time.
#   - The dist/ directory is published to the output branch separately.
#   - This workflow assumes the paths and scripts used by the four original
#     workflows still exist in the repository.
# =============================================================================

# Name of the workflow displayed in the GitHub Actions tab
name: GitHub Profile - All-in-One

# -----------------------------------------------------------------------------
# SECTION 1: WHEN THIS WORKFLOW RUNS
# -----------------------------------------------------------------------------
on:
  schedule:
    # Run every 12 hours daily: 00:30 and 12:30 UTC equivalent to 06:00 AM and 06:00 IST.
    - cron: "30 0,12 * * *"

  # Allow a manual run from Actions -> GitHub Profile - All-in-One -> Run workflow.
  workflow_dispatch:

  # Also run when source files change on main.
  # Generated output paths are ignored to avoid triggering another run from
  # this workflow's own generated commits.
  push:
    branches:
      - main
    paths-ignore:
      - "dist/Assets/Profile-Art/data/**"
      - "dist/Assets/Profile-Art/svg/**"
      - "dist/Assets/Profile-Art/source-prepped.png"
      - "dist/Assets/Profile/**"
      - "dist/Assets/Neo-Cards/**"
      # - "dist/**"

# -----------------------------------------------------------------------------
# SECTION 2: PERMISSIONS AND CONCURRENCY
# -----------------------------------------------------------------------------
permissions:
  contents: write # Needed to commit generated assets and publish the output branch to repository.

# Keep this group consistent so this workflow does not race with the old workflows
# while they are still enabled. Disable the old workflows after verifying this combined workflow.
# Ensure this workflow does not have multiple runs executing at the same time.
# If a new run starts while another is running, the current run will not be cancelled.
concurrency:
  group: generated-profile-assets # Identifier used to group runs of this workflow
  queue: max # Queue runs instead of cancelling an in-progress run.
  cancel-in-progress: false # Do not cancel a running workflow when another run starts

jobs:
  generate-profile-assets:
    runs-on: ubuntu-latest # Run on every scheduled or manual job on an Ubuntu hosted virtual machine runner for all generators.
    timeout-minutes: 30 # Fail the job if all generation steps together take too long.

    steps:
      # =======================================================================
      # SECTION 3: CHECKOUT AND COMMON SETUP
      # =======================================================================

      # Download the repository once. All following sections use this checkout.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch history so the final commit can rebase onto the latest main.

      - name: Copy Assets from Output Branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin output
          git cat-file -e FETCH_HEAD:Assets/.readme-patch/cli.js
          git cat-file -e FETCH_HEAD:Assets/.readme-patch/config.json
          git cat-file -e FETCH_HEAD:Assets/Profile-Art/scripts/requirements.txt
          mkdir -p dist
          git archive FETCH_HEAD Assets | tar -x -C dist

      # Set up Node.js for the local README/Neo/Universe generator.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Set up Python for the Profile Art scripts.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dist/Assets/Profile-Art/scripts/requirements.txt

      # =======================================================================
      # SECTION 4: GITHUB README STATISTICS AND PROFILE CARDS (GitHub-README.yml)
      # =======================================================================

      # Create the folder where the light/dark statistics and language cards are stored.
      - name: Create dist/Assets/Profile directory
        run: mkdir -p dist/Assets/Profile

      # 1. Generate the GitHub statistics card for light mode.
      - name: Generate Light Mode GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          # Specify the type of card to generate
          card: stats

          # Configure username, icons, theme, and colors
          options: "username=G1thub-05&show_icons=true&theme=default&hide_border=true&title_color=00c6ff&icon_color=0072ff&text_color=24292f&bg_color=ffffff"

          output_path: dist/Assets/Profile/github-stats-light.svg # Save the generated SVG at this location
          token: ${{ secrets.GITHUB_TOKEN }} # Authenticate using the GitHub Actions token
          fail_on_error: true # Fail the job if SVG generation fails

      # Generate the GitHub statistics card for dark mode.
      - name: Generate Dark Mode GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=G1thub-05&show_icons=true&theme=radical&hide_border=true&title_color=ff512f&icon_color=ff1744&text_color=ffffff&bg_color=0d1117"
          output_path: dist/Assets/Profile/github-stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # 2. Generate the compact top-languages card for light mode.
      - name: Generate Light Mode Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=G1thub-05&layout=compact&theme=default&hide_border=true"
          output_path: dist/Assets/Profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # Generate the compact top-languages card for dark mode.
      - name: Generate Dark Mode Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=G1thub-05&layout=compact&theme=tokyonight&hide_border=true"
          output_path: dist/Assets/Profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # The activity-graph actions write files under dist/. Create the folder first;
      # the original workflow did this in its separate output job.
      - name: Prepare dist Output Directory
        run: mkdir -p dist

      # 3. Generate light-mode activity graph into dist/ for output-branch publishing.
      - name: Generate Light Mode Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: G1thub-05
          options: "theme=github-compact&color=00c6ff&line=00c6ff&point=ff512f&area=true&hide_border=true"
          output_path: dist/Assets/Profile/activity-graph-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # Generate dark-mode activity graph into dist/ for output-branch publishing.
      - name: Generate Dark Mode Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: G1thub-05
          options: "theme=github&color=00c6ff&line=00c6ff&point=ff512f&area=true&hide_border=true"
          output_path: dist/Assets/Profile/activity-graph-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # 4. Generate profile summary cards. AUTO_PUSH is disabled because this
      # combined workflow collects the output and commits it at the end.
      - name: Generate GitHub Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: G1thub-05
          UTC_OFFSET: 5.5
          AUTO_PUSH: false

      # Copy summary-card SVGs into dist/Assets/Profile using the original filenames.
      - name: Copy Summary Cards to Assets Profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/Assets/Profile
          DEST="dist/Assets/Profile"
          SRC="profile-summary-card-output"

          cp "$SRC/default/1-repos-per-language.svg" "$DEST/repos-per-language-light.svg"
          cp "$SRC/default/2-most-commit-language.svg" "$DEST/most-commit-language-light.svg"
          cp "$SRC/default/3-stats.svg" "$DEST/summary-stats-light.svg"
          cp "$SRC/default/4-productive-time.svg" "$DEST/productive-time-light.svg"

          cp "$SRC/github_dark/1-repos-per-language.svg" "$DEST/repos-per-language-dark.svg"
          cp "$SRC/github_dark/2-most-commit-language.svg" "$DEST/most-commit-language-dark.svg"
          cp "$SRC/github_dark/3-stats.svg" "$DEST/summary-stats-dark.svg"
          cp "$SRC/github_dark/4-productive-time.svg" "$DEST/productive-time-dark.svg"

      # 5. Generate the light-mode contribution streak card.
      - name: Generate Light Mode Streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: "user=G1thub-05&theme=default&hide_border=true&background=ffffff&ring=00c6ff&fire=0072ff&currStreakLabel=0072ff&sideNums=24292f&sideLabels=24292f&dates=6b7280&card_width=495&card_height=195&disable_animations=true"
          output_path: dist/Assets/Profile/github-streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 6. Generate the dark-mode contribution streak card.
      - name: Generate Dark Mode Streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: "user=G1thub-05&theme=radical&hide_border=true&background=0d1117&ring=ff512f&fire=ff1744&currStreakLabel=ffffff&sideNums=ffffff&sideLabels=ffffff&dates=9ca3af&card_width=495&card_height=195&disable_animations=true"
          output_path: dist/Assets/Profile/github-streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 7. Generate both light and dark contribution snakes into dist/.
      - name: Generate Output Branch Contribution Snakes
        uses: Platane/snk@v3
        with:
          github_user_name: G1thub-05
          outputs: |
            dist/Assets/Profile/github-snake.svg?palette=github-light&color_snake=%2300c6ff
            dist/Assets/Profile/github-snake-dark.svg?palette=github-dark&color_snake=%23ff512f

      # 8. Generate GitHub achievement trophies into dist/.
      - name: Generate GitHub Achievement Trophies
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: G1thub-05
          # output_path: dist/github-trophies.svg
          output_path: dist/Assets/Profile/github-trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: flat

      # =======================================================================
      # SECTION 5: NEO CARDS GENERATOR (GitHub-README-Neo.yml)
      # =======================================================================

      # Run the local generator to create the README-style cards.
      # Output is first written to /tmp so the generated cards can be copied
      # into dist/Assets/Neo-Cards without overwriting unrelated files.
      - name: Generate Neo SVG Cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node dist/Assets/.readme-patch/cli.js "$GITHUB_REPOSITORY_OWNER" \
            --config dist/Assets/.readme-patch/config.json \
            --require-activity \
            --clean \
            --out /tmp/readme-generated

          mkdir -p dist/Assets/Neo-Cards
          if [ -d /tmp/readme-generated/Neo-Cards ]; then
            find /tmp/readme-generated/Neo-Cards \
              -maxdepth 1 -type f -name '*.svg' \
              -exec cp -t dist/Assets/Neo-Cards/ {} +
          else
            echo "ERROR: Neo card generator did not create /tmp/readme-generated/Neo-Cards."
            exit 1
          fi

      # =======================================================================
      # SECTION 6: 3D CONTRIBUTION UNIVERSE GENERATOR (GitHub-README-3D-Universe.yml)
      # =======================================================================

      # Run the same local generator in universe-only mode. This writes the
      # universe SVGs to Assets, as in the original workflow.
      - name: Generate 3D Universe SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node dist/Assets/.readme-patch/cli.js "$GITHUB_REPOSITORY_OWNER" \
            --config dist/Assets/.readme-patch/config.json \
            --require-activity \
            --universe-only \
            --out dist/Assets

      # =======================================================================
      # SECTION 7: PROFILE ART - PYTHON DATA AND SVG GENERATION (Github-Profile-Art.yml)
      # =======================================================================

      # Install dependencies used by the contribution/profile data scripts.
      - name: Install Profile Art Python Dependencies
        run: pip install -r dist/Assets/Profile-Art/scripts/requirements.txt

      # Fetch the GitHub contribution and profile data used by the local SVG
      # renderers. GITHUB_TOKEN is provided through the repository's token.
      - name: Fetch Profile Art Data
        working-directory: dist/Assets/Profile-Art/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python fetch_contributions.py
          python fetch_profile.py

      # Render the standard Profile Art SVGs from the fetched data.
      - name: Render Profile Art SVGs
        working-directory: dist/Assets/Profile-Art/scripts
        run: python render_all.py

      # Install the separate dependencies required for background removal and
      # portrait processing. This is separate because the original workflow
      # used requirements-portrait.txt for the portrait tools.
      - name: Install Portrait Dependencies
        run: pip install -r dist/Assets/Profile-Art/scripts/requirements-portrait.txt

      # Prepare the portrait image. With no command-line argument, prep_photo.py
      # downloads the GitHub avatar for USERNAME in config.py.
      - name: Prepare ASCII Portrait Source Image
        working-directory: dist/Assets/Profile-Art/scripts
        run: python prep_photo.py

      # Convert the prepared portrait into an ASCII-art SVG.
      - name: Generate ASCII Portrait SVG
        working-directory: dist/Assets/Profile-Art/scripts
        run: python make_ascii_svg.py

      # Generate the contribution snake SVG in Profile Art's SVG folder.
      - name: Generate Profile Art Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/Assets/Profile-Art/svg/contrib-snake.svg?palette=github-dark&color_snake=#58d5e8


      # =======================================================================
      # SECTION 8: Publish the contents of dist/ to the output branch. This action pushes to the output branch; it does not commit these files to main.
      # =======================================================================
      - name: Publish SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =======================================================================
      # SECTION 9: PUBLISH dist/ TO THE OUTPUT BRANCH (snake/activity/trophy output job)
      # =======================================================================

      # Recreate dist/ so it contains only the files intended for the output
      # branch. The activity graphs generated earlier are preserved by copying
      # them to a temporary directory before cleaning dist/.

      # - name: Prepare Output Branch Files
      #   shell: bash
      #   run: |
      #     set -euo pipefail
      #     mkdir -p /tmp/profile-dist
      #     if [ -f dist/activity-graph-light.svg ]; then
      #       cp dist/activity-graph-light.svg /tmp/profile-dist/
      #     fi
      #     if [ -f dist/activity-graph-dark.svg ]; then
      #       cp dist/activity-graph-dark.svg /tmp/profile-dist/
      #     fi
      #     mkdir -p dist
      #     cp /tmp/profile-dist/*.svg dist/ 2>/dev/null || true

      # =======================================================================
      # SECTION 10: COMMIT ALL GENERATED FILES TO MAIN-BRANCH FILES ONCE IF ANYTHING CHNAGED
      # =======================================================================

      # Stage the generated files from all four original workflows. Using
      # explicit folders keeps unrelated user changes out of the commit.

      # - name: Commit Generated Files to Main If Changed
      #   shell: bash
      #   run: |
      #     set -euo pipefail

      #     # Set the bot identity used for the generated commit.
      #     git config user.name "github-actions[bot]"
      #     git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      #     # Stage generated Profile Art data, SVGs, and prepared portrait.
      #     git add -- dist/Assets/Profile-Art/

      #     # Stage generated README statistics, language, streak, and summary cards.
      #     git add -- dist/Assets/Profile/

      #     # Stage Neo cards and any universe SVGs generated under Assets.
      #     git add -- dist/Assets/Neo-Cards/
      #     git add -- dist/Assets/universe*.svg dist/Assets/Neo-Cards/universe*.svg 2>/dev/null || true

      #     # If no generated file has changed, skip creating an empty commit.
      #     if git diff --cached --quiet; then
      #       echo "No generated files changed; nothing to commit."
      #       exit 0
      #     fi

      #     # Commit all staged generated files together.
      #     git commit -m "Update generated GitHub profile assets"

      #     # Rebase onto the latest main in case another commit arrived during
      #     # generation, then push the combined generated-assets commit.
      #     git fetch origin main
      #     git rebase origin/main
      #     git push origin HEAD:main
