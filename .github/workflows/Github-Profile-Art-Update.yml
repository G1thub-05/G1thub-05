name: Update-Profile-Art.yml

# Define when the workflow should run
on:
  schedule:
    # Run every 12 hours at 00:30 and 12:30 UTC equivalent to 06:00 AM and 06:00 PM IST
    - cron: "30 0,12 * * *"

  # Allow the workflow to be triggered manually
  workflow_dispatch:

  push:
    branches: [main]
    paths-ignore:
      - "Assets/Profile-Art/data/**"
      - "Assets/Profile-Art/svg/**"
      - "Assets/Profile-Art/source-prepped.png"

# Grant permission to commit and push generated files to repository
permissions:
  contents: write

# Ensure this workflow does not have multiple runs executing at the same time.
# If a new run starts while another is running, the current run will not be cancelled.
concurrency:
  group: generated-profile-assets # Identifier used to group runs of this workflow
  queue: max
  cancel-in-progress: false # Do not cancel a running workflow when another run starts


jobs:
  Update-Profile-Art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Assets/Profile-Art/scripts/requirements.txt
      - run: pip install -r Assets/Profile-Art/scripts/requirements.txt

      - name: Fetch data
        working-directory: Assets/Profile-Art/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python fetch_contributions.py
          python fetch_profile.py

      - name: Render SVGs
        working-directory: Assets/Profile-Art/scripts
        run: python render_all.py

      - name: Install portrait dependencies
        run: pip install -r Assets/Profile-Art/scripts/requirements-portrait.txt

      - name: Prepare portrait
        working-directory: Assets/Profile-Art/scripts
        run: python prep_photo.py

      - name: Generate ASCII portrait
        working-directory: Assets/Profile-Art/scripts
        run: python make_ascii_svg.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            Assets/Profile-Art/svg/contrib-snake.svg?palette=github-dark&color_snake=#58d5e8

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update-Profile-Art"
          file_pattern: "Assets/Profile-Art/data/*.json Assets/Profile-Art/svg/*.svg Assets/Profile-Art/source-prepped.png"
